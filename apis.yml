aid: 52toys
name: 52TOYS
description: >-
  52TOYS is a leading IP-driven toy and collectibles company founded in Beijing
  in 2015 on the brand proposition "Play for Fun." It designs and produces blind
  boxes, articulated figures, mechanical and model kits, plush, keychains, and
  lifestyle merchandise across 100+ owned and licensed IPs — original hits like
  BEASTBOX, Panda Roll, Nook, and POUKAPOUKA alongside global licenses such as
  Crayon Shin-chan, Minions, and Tom and Jerry. Its official global storefront
  runs on Shopify at hi52toys.com (52toys.com redirects there) and is notably
  agent-native: it publishes an llms.txt, a Universal Commerce Protocol (UCP)
  merchant profile, a hosted UCP MCP endpoint for agent-driven commerce, and
  Shopify customer-account OpenID Connect discovery. Surfaced in the API
  Evangelist network as a Qiming portfolio company.
